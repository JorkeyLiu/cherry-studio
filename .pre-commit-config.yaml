default_install_hook_types: [pre-commit, post-checkout, post-merge]

repos:
  - repo: local
    hooks:
      # Autofix hooks run first so the read-only checks below read the fixed tree.
      # A "files were modified by this hook" failure means the fix was already
      # written to the worktree: re-add the files and commit again. To see exactly
      # what the hooks changed, run `pnpm exec prek run --show-diff-on-failure`.
      - id: biome-format
        name: Biome format
        language: system
        entry: scripts/hooks/run-pnpm.sh biome format --write --no-errors-on-unmatched
        files: '\.(js|jsx|ts|tsx|cjs|mjs|cts|mts|json|yml|yaml|css|html)$'
        pass_filenames: true

      - id: biome-lint
        name: Biome lint
        language: system
        entry: scripts/hooks/run-pnpm.sh biome lint --write --no-errors-on-unmatched
        files: '\.(ts|tsx)$'
        pass_filenames: true

      - id: eslint-fix
        name: ESLint fix
        language: system
        entry: scripts/hooks/run-pnpm.sh eslint --fix
        files: '\.(js|jsx|ts|tsx|cjs|mjs|cts|mts)$'
        pass_filenames: true

      # Read-only checks run last: they never rewrite the tree, so their failures
      # describe the content that will actually be committed.
      - id: oxlint
        name: Oxlint
        language: system
        entry: scripts/hooks/run-pnpm.sh oxlint
        files: '\.(js|jsx|ts|tsx|cjs|mjs|cts|mts)$'
        pass_filenames: true

      - id: post-checkout-install
        name: pnpm install after checkout
        language: system
        entry: scripts/hooks/install-if-deps-changed.sh checkout
        stages: [post-checkout]
        always_run: true
        pass_filenames: false

      - id: post-merge-install
        name: pnpm install after merge/pull
        language: system
        entry: scripts/hooks/install-if-deps-changed.sh merge
        stages: [post-merge]
        always_run: true
        pass_filenames: false
